## env variables
#
## Autostart applications
exec_once = noctalia
exec_once = easyeffects
exec_once = qpwgraph
exec_once = steam
exec_once = vesktop
exec_once = zen-beta

## Autostart Scripts
exec_once = ~/Documents/audioscript.sh
exec_once = mv ~/Pictures/Screenshots/screenshot* ~/Pictures/Screenshots/oldScreenshots/

## Other
exec_once = systemctl --user enable --now hyprpolkitagent.service
exec_once = systemctl --user start xdg-desktop-portal.service --ignore-dependencies
